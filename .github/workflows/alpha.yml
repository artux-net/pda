name: Alpha Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build from
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Alpha build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Resolve build ref
        id: build_ref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build & Deploy
        # Pinned to @main (not ./.github/assembly) so this always runs the
        # trusted, reviewed action definition regardless of what's checked
        # out - closes a path where a build triggered from an unreviewed
        # ref could smuggle a modified assembly step in with the secrets.
        uses: artux-net/pda/.github/assembly@main
        id: assembly
        with:
          profile: alpha
          signing_key: ${{ secrets.SIGNING_KEY }}
          key_alias: ${{ secrets.KEY_ALIAS }}
          keystore_password: ${{ secrets.KEYSTORE_PASSWORD }}
          key_password: ${{ secrets.KEY_PASSWORD }}
          service_account_json: ${{ secrets.SERVICE_ACCOUNT_JSON }}

      - name: Extract PR number
        id: extract_pr
        env:
          # head_commit is only present on push events - a manual
          # workflow_dispatch run has no commit message to parse, so PR
          # number/title just come back empty and the message below falls
          # back to the ref that was built.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          echo "Исходное сообщение: $COMMIT_MESSAGE"
          pr_number=$(echo "$COMMIT_MESSAGE" | grep -oE '#[0-9]+' | head -n 1 | tr -d '#')
          echo "Извлечённый номер PR: $pr_number"
          echo "pr_number=$pr_number" >> $GITHUB_OUTPUT

          # Telegram's "markdown" (legacy) parse mode errors out on any
          # unbalanced _ * ` [ in the message - a squash-merge commit body
          # (e.g. a PR description) routinely has these, which silently
          # killed this notify step. Use only the first line, with those
          # characters escaped, instead of the raw multi-line message.
          commit_title=$(echo "$COMMIT_MESSAGE" | head -n 1 | sed -E 's/([_*`\[])/\\\1/g')
          echo "commit_title=$commit_title" >> $GITHUB_OUTPUT

      - name: Send message to Artux channel
        continue-on-error: true
        uses: artux-net/pda/.github/notify@main
        with:
          to: ${{ vars.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          thread_id: ${{ vars.TELEGRAM_THREAD_ID }}
          message: |
            Alpha сборка ${{ steps.assembly.outputs.versionCode }}, версия ${{ steps.assembly.outputs.versionName }}

            Опубликована в internal-канале Google Play

            Название: ${{ steps.extract_pr.outputs.commit_title || format('ручной запуск из `{0}`', inputs.ref) }}
            Автор: ${{ github.event.head_commit.author.name || github.actor }}
            [PR](https://github.com/${{ github.repository }}/pull/${{ steps.extract_pr.outputs.pr_number }}) | [Changes](https://github.com/${{ github.repository }}/commit/${{ steps.build_ref.outputs.sha }}) | [Crashlytics](https://console.firebase.google.com/project/${{ vars.FIREBASE_ID }}/crashlytics/app/android:${{ vars.PACKAGE }}/issues?state=open&time=last-seven-days&types=crash&tag=all&sort=eventCount&versions=${{ steps.assembly.outputs.versionName }})
            [Скачать APK](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
