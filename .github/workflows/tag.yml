name: Create tag

on:
  workflow_run:
    workflows: [Alpha Build]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  tag-commit:
    name: Tag Commit
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Generate Version
        id: version
        uses: paulhatch/semantic-version@v5.4.0

      - name: Create tag
        run: git tag ${{ steps.version.outputs.version_tag }} ${{ github.event.workflow_run.head_sha }} && git push origin ${{ steps.version.outputs.version_tag }}

      - name: Trigger Beta Build
        # A tag pushed with the default GITHUB_TOKEN does not trigger other
        # workflows' `on: push` (GitHub's anti-loop protection), so beta.yml
        # would never fire on its own. That protection only covers the
        # automatic event cascade though - explicitly dispatching beta.yml
        # via the API on the new tag ref works fine with the default token
        # and needs no extra secret/PAT.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run beta.yml --repo ${{ github.repository }} --ref ${{ steps.version.outputs.version_tag }}
