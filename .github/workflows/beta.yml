name: Beta Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    # No inputs: dispatched by tag.yml with --ref <tag>, which resolves
    # github.ref_name/github.sha below the same way a `push: tags:` event
    # would, so the rest of this workflow needs no changes for that path.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Beta build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout assets submodule
        # pda-assets is private now, so the default GITHUB_TOKEN (scoped
        # to this repo only) can't clone it as a submodule - that needs a
        # PAT with read access to artux-net/pda-assets.
        run: |
          git config --global url."https://x-access-token:${{ secrets.PDA_ASSETS_TOKEN }}@github.com/artux-net/pda-assets.git".insteadOf "https://github.com/artux-net/pda-assets.git"
          git submodule update --init --recursive

      - name: Build & Deploy
        # Pinned to @main: a v* tag isn't covered by branch protection, so
        # without this a tag pushed straight at an unreviewed commit could
        # run a modified assembly action with the signing secrets.
        uses: artux-net/pda/.github/assembly@main
        id: assembly
        with:
          profile: beta
          signing_key: ${{ secrets.SIGNING_KEY }}
          key_alias: ${{ secrets.KEY_ALIAS }}
          keystore_password: ${{ secrets.KEYSTORE_PASSWORD }}
          key_password: ${{ secrets.KEY_PASSWORD }}
          service_account_json: ${{ secrets.SERVICE_ACCOUNT_JSON }}

      - name: Send message to Artux channel
        continue-on-error: true
        uses: artux-net/pda/.github/notify@main
        with:
          to: ${{ vars.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          thread_id: ${{ vars.TELEGRAM_THREAD_ID }}
          message: |
            Beta сборка из тега ${{ github.ref_name }}

            Код ${{ steps.assembly.outputs.versionCode }}, версия ${{ steps.assembly.outputs.versionName }}
            Опубликована в beta-канале Google Play

            [Changes](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) | [Crashlytics](https://console.firebase.google.com/project/${{ vars.FIREBASE_ID }}/crashlytics/app/android:${{ vars.PACKAGE }}/issues?state=open&time=last-seven-days&types=crash&tag=all&sort=eventCount&versions=${{ steps.assembly.outputs.versionName }})
