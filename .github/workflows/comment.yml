name: Comment PR

on:
  pull_request:
    types:
      - opened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Comment PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            `/preview` или `/build` - вызов сборки APK и публикация в закрытом канале

      - name: Escape PR title for Telegram
        id: escape_title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Telegram's "markdown" (legacy) parse mode errors out on any
          # unbalanced _ * ` [ in the message - a PR title routinely has
          # these, which would silently kill the notify step below. That
          # escaping only works outside an entity, so the title must stay
          # out of the link text - inside [...] an escaped * breaks the link.
          echo "title=$(echo "$PR_TITLE" | sed -E 's/([_*`\[])/\\\1/g')" >> $GITHUB_OUTPUT

      - name: Send message to Artux channel
        # Pinned to @main: same-repo (non-fork) PRs get secrets on this
        # event, so a local-path reference here could run a PR-modified
        # notify action with TELEGRAM_TOKEN.
        continue-on-error: true
        uses: artux-net/pda/.github/notify@main
        with:
          to: ${{ vars.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          thread_id: ${{ vars.TELEGRAM_THREAD_ID }}
          message: |
            Опубликован новый PR [#${{ github.event.pull_request.number }}](${{ github.event.pull_request.html_url }}): ${{ steps.escape_title.outputs.title }}
            Автор: ${{ github.event.pull_request.user.login }}
